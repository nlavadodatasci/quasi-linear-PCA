name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q

  wheel:
    name: wheel install and README quick start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/dist" .
      - name: Install in a clean environment outside the repository and run the quick start
        env:
          MPLBACKEND: Agg
        run: |
          python -m venv "$RUNNER_TEMP/clean"
          "$RUNNER_TEMP/clean/bin/python" -m pip install "$RUNNER_TEMP"/dist/qlpca-*.whl
          cp README.md tools/check_quickstart.py "$RUNNER_TEMP/"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/clean/bin/python" -I check_quickstart.py README.md

  notebooks:
    name: execute notebooks
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[notebooks]"
          python -m ipykernel install --user --name python3
      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: python tools/run_notebooks.py

  comparison:
    name: comparison with princals (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install qlpca, pyGifi (pinned, with its C extension) and the comparison requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r comparison/princals/requirements.txt
          python comparison/princals/install_pygifi.py
      - name: Quick comparison tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q comparison/princals/tests
