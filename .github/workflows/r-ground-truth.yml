name: R ground truth (princals)

# Manual workflow: runs Gifi::princals (R) on the inputs of comparison/princals/manifest.json
# and publishes the JSON files as an artefact. Download them into
# comparison/princals/results/r_ground_truth/ and commit them.

on:
  workflow_dispatch:

jobs:
  gifi:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: comparison/princals
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export the input data (qlpca, pyGifi for neumann, UCI download)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../.. -r requirements.txt
          python compare.py inputs
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install Gifi 1.0-0 and jsonlite
        run: |
          Rscript -e 'install.packages(c("remotes", "jsonlite"))'
          Rscript -e 'remotes::install_version("Gifi", version = "1.0-0", upgrade = "never")'
          Rscript -e 'cat("Gifi", as.character(packageVersion("Gifi")), "\n")'
      - name: Run princals
        run: Rscript generate_r_ground_truth.R
      - uses: actions/upload-artifact@v4
        with:
          name: r-ground-truth
          path: comparison/princals/results/r_ground_truth/*.json
          if-no-files-found: error
